<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKRPRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--surface:#0e1016;--card:#13161e;--card-hover:#181c26;--border:#252a36;--text:#f1f3f7;--muted:#8b93a7;--accent:#6366f1;--green:#34d399;--amber:#fbbf24;--rose:#fb7185;--cyan:#22d3ee;--radius:14px;--font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;--glow-indigo:0 0 24px rgba(99,102,241,.25)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(ellipse 900px 500px at 15% -5%,rgba(99,102,241,.12),transparent 55%),radial-gradient(ellipse 700px 400px at 95% 10%,rgba(168,85,247,.1),transparent 50%),radial-gradient(ellipse 600px 350px at 50% 100%,rgba(34,211,238,.06),transparent 50%);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;animation:float-up linear infinite;opacity:0}
@keyframes float-up{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:.55}90%{opacity:.25}100%{transform:translateY(-10vh) scale(1);opacity:0}}
.header{position:sticky;top:0;z-index:50;background:rgba(7,8,12,.82);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border);box-shadow:0 4px 30px rgba(0,0,0,.4),0 1px 0 rgba(99,102,241,.08);padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;animation:slide-down .5s cubic-bezier(.22,1,.36,1)}
@keyframes slide-down{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.logo{font-weight:800;font-size:18px;letter-spacing:-.03em;background:linear-gradient(135deg,#818cf8,#c084fc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 12px rgba(129,140,248,.35));animation:logo-pulse 3s ease-in-out infinite}
@keyframes logo-pulse{0%,100%{filter:drop-shadow(0 0 10px rgba(129,140,248,.3))}50%{filter:drop-shadow(0 0 18px rgba(168,85,247,.45))}}
.header-actions{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer;transition:all .2s cubic-bezier(.22,1,.36,1);display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.06),transparent);opacity:0;transition:opacity .2s}
.btn:hover{border-color:rgba(99,102,241,.5);background:var(--card-hover);box-shadow:var(--glow-indigo);transform:translateY(-1px)}.btn:hover::before{opacity:1}.btn:active{transform:translateY(0) scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.35)}.btn-primary:hover{filter:brightness(1.1);box-shadow:0 6px 24px rgba(99,102,241,.5);border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.05);border-color:transparent;box-shadow:none}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}.btn-danger{background:rgba(251,113,133,.12);border-color:rgba(251,113,133,.35);color:#fb7185}.btn-danger:hover{background:rgba(251,113,133,.22);border-color:rgba(251,113,133,.55);box-shadow:0 0 16px rgba(251,113,133,.25);color:#fda4af}
.btn-cyan{background:linear-gradient(135deg,#0891b2,#06b6d4);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(6,182,212,.3)}.btn-cyan:hover{filter:brightness(1.1);box-shadow:0 6px 20px rgba(6,182,212,.45);border-color:transparent}
.main{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:28px 16px 70px;animation:fade-up .6s cubic-bezier(.22,1,.36,1) .1s both}
@keyframes fade-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;position:relative;overflow:hidden;transition:all .25s cubic-bezier(.22,1,.36,1);animation:card-in .5s cubic-bezier(.22,1,.36,1) both}
.stat:nth-child(1){animation-delay:.05s}.stat:nth-child(2){animation-delay:.1s}.stat:nth-child(3){animation-delay:.15s}.stat:nth-child(4){animation-delay:.2s}
@keyframes card-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.65}
.stat:nth-child(2)::after{background:linear-gradient(90deg,transparent,var(--green),transparent)}.stat:nth-child(3)::after{background:linear-gradient(90deg,transparent,var(--cyan),transparent)}.stat:nth-child(4)::after{background:linear-gradient(90deg,transparent,var(--amber),transparent)}
.stat:hover{border-color:rgba(99,102,241,.4);box-shadow:var(--glow-indigo);transform:translateY(-2px)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500;letter-spacing:.02em}
.stat-value{font-size:26px;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,#e0e7ff,#c7d2fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.green{background:linear-gradient(135deg,#6ee7b7,#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.cyan{background:linear-gradient(135deg,#67e8f9,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-value.amber{background:linear-gradient(135deg,#fcd34d,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px}
.tabs{display:flex;gap:4px;background:var(--surface);padding:5px;border-radius:12px;border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.tab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border:none;background:transparent;font-family:var(--font);transition:all .2s}.tab:hover{color:var(--text)}
.tab.active{background:linear-gradient(135deg,rgba(99,102,241,.25),rgba(168,85,247,.2));color:#c7d2fe;box-shadow:0 0 16px rgba(99,102,241,.2),inset 0 0 0 1px rgba(99,102,241,.3)}
.search{flex:1;min-width:150px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:all .2s}
.search:focus{border-color:rgba(99,102,241,.6);box-shadow:0 0 0 3px rgba(99,102,241,.15),var(--glow-indigo)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all .25s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;animation:card-in .45s cubic-bezier(.22,1,.36,1) both}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,.4),transparent)}
.card:hover{border-color:rgba(99,102,241,.45);box-shadow:var(--glow-indigo),0 8px 28px rgba(0,0,0,.35);transform:translateY(-3px);background:var(--card-hover)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:10px}
.card-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;letter-spacing:.02em}
.badge.online{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.3);box-shadow:0 0 12px rgba(52,211,153,.15)}
.badge.in-match{background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.35);box-shadow:0 0 14px rgba(99,102,241,.2);animation:pulse-badge 2s ease-in-out infinite}
.badge.paused{background:rgba(251,191,36,.12);color:var(--amber);border:1px solid rgba(251,191,36,.3)}
.badge.offline{background:rgba(251,113,133,.1);color:var(--rose);border:1px solid rgba(251,113,133,.25)}
@keyframes pulse-badge{0%,100%{box-shadow:0 0 12px rgba(99,102,241,.2)}50%{box-shadow:0 0 20px rgba(99,102,241,.4)}}
.card-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.cs-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;transition:border-color .2s}.card:hover .cs-item{border-color:rgba(99,102,241,.2)}
.cs-label{font-size:11px;color:var(--muted);font-weight:500}.cs-val{font-weight:700;font-size:15px;margin-top:3px}
.card-actions{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.empty{text-align:center;padding:70px 20px;color:var(--muted);animation:fade-up .5s ease both}
.empty h3{margin-bottom:8px;font-size:17px;font-weight:700;background:linear-gradient(135deg,#c7d2fe,#e9d5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.empty p{font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;animation:fade-in .2s ease}.modal-bg.open{display:flex}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 40px rgba(99,102,241,.12);animation:modal-in .3s cubic-bezier(.22,1,.36,1);position:relative}
.modal::before{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,transparent,#818cf8,#c084fc,transparent);border-radius:2px}
@keyframes modal-in{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.modal h2{font-size:18px;font-weight:750;margin-bottom:4px;background:linear-gradient(135deg,#e0e7ff,#ddd6fe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal .hint{font-size:12px;color:var(--muted);margin-bottom:18px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 13px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:all .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:rgba(99,102,241,.6);box-shadow:0 0 0 3px rgba(99,102,241,.12),var(--glow-indigo)}
.form-group textarea{min-height:90px;resize:vertical;font-family:var(--mono);font-size:12px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 18px;font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.45);animation:toast-in .3s cubic-bezier(.22,1,.36,1)}
.toast.ok{border-color:rgba(52,211,153,.4);box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 20px rgba(52,211,153,.12)}
.toast.err{border-color:rgba(251,113,133,.4);box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 20px rgba(251,113,133,.12)}
@keyframes toast-in{from{opacity:0;transform:translateX(30px) scale(.95)}to{opacity:1;transform:none}}
.progress-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:11px;max-height:130px;overflow:auto;color:var(--muted);margin-bottom:16px;display:none;box-shadow:inset 0 0 20px rgba(99,102,241,.05)}.progress-box.show{display:block;animation:fade-up .3s ease}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.header{padding:0 12px}.main{padding:18px 12px 60px}.logo{font-size:16px}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<header class="header">
  <div class="logo">CKRPRO</div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="btn-refresh" onclick="sndClick();refresh()">Refresh</button>
    <button class="btn btn-cyan btn-sm" onclick="sndClick();openAddAcc()">+ Account</button>
    <button class="btn btn-primary btn-sm" onclick="sndClick();openCreateTeam()">+ Team</button>
  </div>
</header>
<main class="main">
  <div class="stats">
    <div class="stat"><div class="stat-label">Accounts</div><div class="stat-value" id="s-bots">0</div></div>
    <div class="stat"><div class="stat-label">Online</div><div class="stat-value green" id="s-online">0</div></div>
    <div class="stat"><div class="stat-label">In Match</div><div class="stat-value cyan" id="s-match">0</div></div>
    <div class="stat"><div class="stat-label">Matches Done</div><div class="stat-value amber" id="s-done">0</div></div>
  </div>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" onclick="sndTab();setFilter('all',this)">All</button>
      <button class="tab" onclick="sndTab();setFilter('online',this)">Online</button>
      <button class="tab" onclick="sndTab();setFilter('match',this)">In Match</button>
      <button class="tab" onclick="sndTab();setFilter('paused',this)">Paused</button>
    </div>
    <input class="search" id="search" placeholder="Search UID..." oninput="render()" onfocus="sndSoft()">
    <button class="btn btn-sm" onclick="sndClick();togglePauseAll()">Pause All</button>
  </div>
  <div id="create-progress" class="progress-box"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"><h3>No accounts running</h3><p>Use “+ Team” to auto-create bots or “+ Account” to add existing UID</p></div>
</main>
<div class="modal-bg" id="team-modal">
  <div class="modal">
    <h2>Create Team</h2>
    <p class="hint">Auto-creates guest accounts and joins the clan</p>
    <div class="form-group"><label>Clan ID</label><input id="t-clan" placeholder="3105473574" onfocus="sndSoft()"></div>
    <div class="form-group"><label>Region</label>
      <select id="t-region" onfocus="sndSoft()">
        <option value="IND">IND</option><option value="SG">SG</option><option value="BD">BD</option>
        <option value="TH">TH</option><option value="ID">ID</option><option value="BR">BR</option>
        <option value="US">US</option><option value="ME">ME</option><option value="PK">PK</option>
        <option value="TW">TW</option><option value="VN">VN</option><option value="RU">RU</option>
      </select>
    </div>
    <div class="form-group"><label>Bot Count (1–4)</label><input id="t-count" type="number" min="1" max="4" value="4" onfocus="sndSoft()"></div>
    <div class="modal-actions">
      <button class="btn" onclick="sndClick();closeModals()">Cancel</button>
      <button class="btn btn-primary" onclick="sndSuccess();submitTeam()">Start</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="acc-modal">
  <div class="modal">
    <h2>Add Account</h2>
    <p class="hint">Existing UID + password (guest login)</p>
    <div class="form-group"><label>UID</label><input id="a-uid" placeholder="123456789" onfocus="sndSoft()"></div>
    <div class="form-group"><label>Password</label><input id="a-pass" type="password" placeholder="password" onfocus="sndSoft()"></div>
    <div class="modal-actions">
      <button class="btn" onclick="sndClick();closeModals()">Cancel</button>
      <button class="btn btn-primary" onclick="sndSuccess();submitAccount()">Add</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<script>
var AudioCtx=window.AudioContext||window.webkitAudioContext,actx=null;
function ensureAudio(){if(!actx)actx=new AudioCtx();if(actx.state==="suspended")actx.resume();return actx}
function beep(freq,dur,type,vol,slide){try{var ctx=ensureAudio(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(freq,ctx.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ctx.currentTime+dur);g.gain.setValueAtTime(vol||.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}
function sndClick(){beep(520,.06,"sine",.07);setTimeout(function(){beep(780,.05,"sine",.04)},40)}
function sndTab(){beep(440,.05,"triangle",.06)}
function sndSoft(){beep(360,.04,"sine",.035)}
function sndSuccess(){beep(523,.08,"sine",.07);setTimeout(function(){beep(659,.08,"sine",.06)},70);setTimeout(function(){beep(784,.12,"sine",.05)},140)}
function sndError(){beep(280,.12,"sawtooth",.05);setTimeout(function(){beep(200,.15,"sawtooth",.04)},80)}
function sndToast(){beep(660,.07,"sine",.05);setTimeout(function(){beep(880,.08,"sine",.04)},60)}
(function(){var box=document.getElementById("particles"),colors=["rgba(99,102,241,.45)","rgba(168,85,247,.4)","rgba(34,211,238,.35)","rgba(52,211,153,.3)"];for(var i=0;i<28;i++){var p=document.createElement("div");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=8+Math.random()*14+"s";p.style.animationDelay=Math.random()*10+"s";p.style.background=colors[i%colors.length];p.style.width=p.style.height=2+Math.random()*3+"px";box.appendChild(p)}})();
document.addEventListener("click",function(){ensureAudio()},{once:true});
document.addEventListener("touchstart",function(){ensureAudio()},{once:true});
var S={accounts:[],filter:"all",creating:false,progress:[]};
async function api(path,opts){opts=opts||{};try{var r=await fetch(path,{headers:Object.assign({"Content-Type":"application/json"},opts.headers||{}),method:opts.method,body:opts.body});var t=await r.text();try{return JSON.parse(t)}catch(e){return{raw:t}}}catch(e){return{error:String(e)}}}
async function post(path,body){return api(path,{method:"POST",body:JSON.stringify(body||{})})}
function toast(msg,type){type=type||"ok";sndToast();if(type==="err")sndError();var el=document.createElement("div");el.className="toast "+type;el.textContent=msg;document.getElementById("toasts").appendChild(el);setTimeout(function(){el.style.opacity="0";el.style.transform="translateX(20px)";el.style.transition="all .25s";setTimeout(function(){el.remove()},250)},3000)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function setFilter(f,btn){S.filter=f;document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active")});btn.classList.add("active");render()}
function statusClass(a){var s=(a.status||"").toLowerCase();if(a.is_paused||s.indexOf("pause")>=0)return"paused";if(s.indexOf("match")>=0||s.indexOf("search")>=0)return"in-match";if(s.indexOf("off")>=0||s==="")return"offline";return"online"}
function statusLabel(a){var c=statusClass(a);if(c==="in-match")return"In Match";if(c==="paused")return"Paused";if(c==="offline")return"Offline";return a.status||"Online"}
function render(){var q=(document.getElementById("search").value||"").toLowerCase().trim();var list=(S.accounts||[]).filter(function(a){var c=statusClass(a);if(S.filter==="online"&&c!=="online")return false;if(S.filter==="match"&&c!=="in-match")return false;if(S.filter==="paused"&&c!=="paused")return false;if(q){var hay=((a.uid||a.auth_uid||"")+" "+(a.nickname||"")).toLowerCase();if(hay.indexOf(q)<0)return false}return true});var all=S.accounts||[];document.getElementById("s-bots").textContent=all.length;document.getElementById("s-online").textContent=all.filter(function(a){return statusClass(a)==="online"||statusClass(a)==="in-match"}).length;document.getElementById("s-match").textContent=all.filter(function(a){return statusClass(a)==="in-match"}).length;document.getElementById("s-done").textContent=all.reduce(function(s,a){return s+(a.matches||0)},0);var grid=document.getElementById("grid"),empty=document.getElementById("empty");if(!list.length){grid.innerHTML="";empty.style.display="block"}else{empty.style.display="none";grid.innerHTML=list.map(function(a,i){var c=statusClass(a),uid=a.uid||a.auth_uid||"—",nick=a.nickname||a.name||"";return'<div class="card" style="animation-delay:'+Math.min(i*.04,.4)+'s"><div class="card-top"><div style="min-width:0"><div class="card-title">'+esc(nick||("UID "+uid))+'</div><div class="card-sub">'+esc(String(uid))+'</div></div><span class="badge '+c+'">'+statusLabel(a)+'</span></div><div class="card-stats"><div class="cs-item"><div class="cs-label">Matches</div><div class="cs-val">'+(a.matches||0)+'</div></div><div class="cs-item"><div class="cs-label">Active</div><div class="cs-val">'+(a.active_matches||0)+'</div></div><div class="cs-item"><div class="cs-label">EXP</div><div class="cs-val">'+(a.current_exp||a.exp||0)+'</div></div></div><div class="card-actions"><button class="btn btn-sm" onclick="sndClick();pauseOne(\''+esc(String(uid))+'\')">'+(a.is_paused?"Resume":"Pause")+'</button><button class="btn btn-sm" onclick="sndClick();restartOne(\''+esc(String(uid))+'\')">Restart</button><button class="btn btn-sm btn-danger" onclick="sndClick();deleteOne(\''+esc(String(uid))+'\')">Delete</button></div></div>'}).join("")}var pb=document.getElementById("create-progress");if(S.creating||(S.progress&&S.progress.length)){pb.classList.add("show");pb.innerHTML=(S.progress||[]).slice(-8).map(function(x){return esc(x)}).join("<br>")||"Creating..."}else pb.classList.remove("show")}
function openCreateTeam(){document.getElementById("team-modal").classList.add("open");sndSoft()}
function openAddAcc(){document.getElementById("acc-modal").classList.add("open");sndSoft()}
function closeModals(){document.querySelectorAll(".modal-bg").forEach(function(m){m.classList.remove("open")})}
async function submitTeam(){var clan_id=document.getElementById("t-clan").value.trim(),region=document.getElementById("t-region").value,count=parseInt(document.getElementById("t-count").value,10)||4;if(!clan_id){toast("Clan ID required","err");return}var res=await post("/api/create_team",{clan_id:clan_id,region:region,count:count});if(res.ok===false||res.error)toast(res.error||"Failed","err");else{toast(res.msg||"Creating team...");closeModals()}setTimeout(refresh,1000)}
async function submitAccount(){var uid=document.getElementById("a-uid").value.trim(),password=document.getElementById("a-pass").value.trim();if(!uid||!password){toast("UID and password required","err");return}var res=await post("/api/account/add",{uid:uid,password:password});if(res.status==="ok"){toast("Account added");closeModals();document.getElementById("a-uid").value="";document.getElementById("a-pass").value=""}else toast(res.error||"Failed","err");setTimeout(refresh,800)}
async function pauseOne(uid){await post("/api/account/pause",{uid:uid});toast("Toggled pause");setTimeout(refresh,400)}
async function restartOne(uid){await post("/api/account/restart",{uid:uid});toast("Restarting...");setTimeout(refresh,800)}async function deleteOne(uid){if(!confirm("Delete account "+uid+"?"))return;var res=await post("/api/account/delete",{uid:uid});if(res.status==="ok"||res.ok){toast("Account deleted");sndSuccess()}else toast(res.error||"Delete failed","err");setTimeout(refresh,500)}
async function togglePauseAll(){var d=await post("/api/account/pause_all");toast(d.all_paused?"All paused":(d.error||"Toggled"));setTimeout(refresh,500)}
async function refresh(){var btn=document.getElementById("btn-refresh");if(btn)btn.textContent="...";var data=await api("/api/stats");if(data&&Array.isArray(data.accounts)){S.accounts=data.accounts;S.creating=!!data.creating;S.progress=data.create_progress||[]}render();if(btn)btn.textContent="Refresh"}
document.querySelectorAll(".modal-bg").forEach(function(m){m.addEventListener("click",function(e){if(e.target===m){sndClick();m.classList.remove("open")}})});
refresh();setInterval(refresh,6000);
</script>
</body>
</html>
